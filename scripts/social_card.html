<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 675px; background: #0e1015; color: #e8eaf0; overflow: hidden;
         font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; position: relative; }
  .left { position: absolute; left: 64px; top: 72px; width: 520px; }
  .mark { width: 96px; height: 96px; }
  h1 { font-size: 92px; letter-spacing: -2px; margin-top: 22px; line-height: 1; }
  p { font-size: 32px; color: #8b93a5; margin-top: 22px; line-height: 1.3; }
  .stat { position: absolute; left: 64px; bottom: 64px; display: flex; gap: 14px; }
  .chip { border: 2px solid #262b38; border-radius: 12px; padding: 12px 18px; font-size: 25px; }
  .chip b { color: #ffb020; }
  .shot { position: absolute; left: 640px; top: 70px; width: 640px; height: 535px;
          border-radius: 16px 0 0 16px; border: 2px solid #262b38; border-right: 0;
          background: url(../assets/app-grid.png) left top / 1000px auto no-repeat;
          box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
</style>
<div class="left">
  <svg class="mark" viewBox="0 0 32 32">
    <rect x="2" y="9" width="16" height="12" rx="2.2" fill="none" stroke="#8b93a5" stroke-width="1.6" opacity=".45"/>
    <rect x="5" y="7" width="16" height="12" rx="2.2" fill="none" stroke="#8b93a5" stroke-width="1.6" opacity=".7"/>
    <rect x="8" y="5" width="16" height="12" rx="2.2" fill="#ffb020"/>
    <path d="M12.2 11.4l2.3 2.3 4.5-4.7" fill="none" stroke="#1b1307" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Burstwise</h1>
  <p>Cull a folder of photos down to the best frame of every burst.</p>
</div>
<div class="stat">
  <div class="chip"><b>166</b> photos in <b>1.9 s</b></div>
  <div class="chip">local, 9 languages</div>
</div>
<div class="shot"></div>
