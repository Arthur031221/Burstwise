name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl libegl1 libgles2
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/burstwise
          key: models-v1
      - name: Tests with the real models
        run: pytest -m models -k "not browser"
      - name: Browser tests
        if: matrix.python == '3.12'
        run: |
          playwright install --with-deps chromium
          pytest -m browser

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          burstwise --version
          python -c "import importlib.resources as r; print(len(list(r.files('burstwise.web').joinpath('locales').iterdir())), 'locales')"
